[package]
name = "pickscribe"
version = "0.3.0"
edition = "2024"
description = "PickScribe by Pickforge Studio: press Right Alt, speak, and the text lands in the focused app"
license = "MIT"
repository = "https://github.com/pickforge/pickscribe"

[lints.clippy]
cognitive_complexity = "deny"
too_many_lines = "deny"

[profile.release]
debug = "line-tables-only"

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", features = ["pipewire"] }
evdev = "0.13"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
hound = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
whisper-rs = { version = "0.16", features = ["vulkan"] }
